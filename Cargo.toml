[package]
name = "reginald-bank"
version = "0.1.0"
authors = ["MikalDr", "Neelzee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.82"
dotenv = "0.15.0"
pest = "2.7.9"
pest_derive = "2.7.9"
serde = { version = "1.0.198", features = ["derive"] }
serde_json = "1.0.116"
serenity = "0.12.1"
time = "0.3.36"
tokio = { version = "1.37.0", features = ["full"]}
