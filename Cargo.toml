[package]
name = "reginald_bank"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["reginald_db","reginald_ast", "reginald_conf", "reginald_discord"]

[dependencies]
reginald_ast = { workspace = true, optional = true, features = ["repl"] }
reginald_discord = { workspace = true, optional = true }
reginald_db = { workspace = true, optional = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[workspace.dependencies]
anyhow = "1.0.100"
pest = "2.8.3"
pest_derive = "2.8.3"
rand = "0.9.2"
rstest = "0.26.1"
serde = "1.0.228"
toml = "0.9.8"
serenity = "0.12.4"
tokio = { version = "1.48.0" }
reginald_ast = { path = "reginald_ast" }
reginald_discord = { path = "reginald_discord" }
reginald_conf = { path = "reginald_conf" }
reginald_db = { path = "reginald_db" }
sqlite = "0.37.0"
uuid = "1.21.0"

[features]
default = ["discord"]
repl = ["dep:reginald_ast"]
discord = ["dep:reginald_ast", "dep:reginald_discord", "dep:reginald_db"]
